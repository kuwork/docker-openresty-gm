name: Publish Docker images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_IMAGE: kuwork/openresty
  LOCAL_IMAGE: localhost:5000/kuwork/openresty
  RESTY_IMAGE_BASE: alpine
  RESTY_OPENSSL_URL_BASE: https://www.openssl.org/source
  RESTY_PCRE_URL_BASE: https://github.com/PCRE2Project/pcre2/releases/download

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the vX.Y.Z format, for example v1.0.0."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Start temporary build registry
        run: |
          set -euo pipefail
          docker run --detach \
            --name openresty-build-registry \
            --publish 5000:5000 \
            --restart=always \
            registry:2
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5000/v2/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs openresty-build-registry
          echo "Temporary build registry did not become ready."
          exit 1

      - name: Build all three images for ${{ matrix.platform }}
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "${PLATFORM}" \
            --push \
            --build-arg RESTY_IMAGE_BASE="${RESTY_IMAGE_BASE}" \
            --build-arg RESTY_OPENSSL_URL_BASE="${RESTY_OPENSSL_URL_BASE}" \
            --build-arg RESTY_PCRE_URL_BASE="${RESTY_PCRE_URL_BASE}" \
            --build-arg RESTY_J=4 \
            --file alpine/Dockerfile \
            --tag "${LOCAL_IMAGE}:alpine" \
            .

          docker buildx build \
            --platform "${PLATFORM}" \
            --push \
            --build-arg RESTY_FAT_IMAGE_BASE="${LOCAL_IMAGE}" \
            --build-arg RESTY_FAT_IMAGE_TAG=alpine \
            --build-arg RESTY_LUAROCKS_VERSION=3.13.0 \
            --file alpine/Dockerfile.fat \
            --tag "${LOCAL_IMAGE}:alpine-fat" \
            .

          docker buildx build \
            --platform "${PLATFORM}" \
            --push \
            --build-arg RESTY_IMAGE_BASE="${LOCAL_IMAGE}" \
            --build-arg RESTY_IMAGE_TAG=alpine-fat \
            --build-arg RESTY_J=4 \
            --file Dockerfile \
            --tag "${LOCAL_IMAGE}:alpine-fat-gm" \
            .

      - name: Verify ${{ matrix.platform }} natively
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker run --rm --platform "${PLATFORM}" "${LOCAL_IMAGE}:alpine" openresty -V
          docker run --rm --platform "${PLATFORM}" "${LOCAL_IMAGE}:alpine-fat" luarocks --version
          docker run --rm --platform "${PLATFORM}" "${LOCAL_IMAGE}:alpine-fat-gm" gm version

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push ${{ matrix.arch }} image tags
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for tag in alpine alpine-fat alpine-fat-gm; do
            docker buildx imagetools create \
              --tag "${DOCKER_IMAGE}:${tag}-${ARCH}" \
              "${LOCAL_IMAGE}:${tag}"
          done

  publish:
    name: Publish multi-architecture tags
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge architectures into six multi-architecture tags
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for tag in alpine alpine-fat alpine-fat-gm; do
            docker buildx imagetools create \
              --tag "${DOCKER_IMAGE}:${tag}-${VERSION}" \
              --tag "${DOCKER_IMAGE}:${tag}" \
              "${DOCKER_IMAGE}:${tag}-amd64" \
              "${DOCKER_IMAGE}:${tag}-arm64"
            docker buildx imagetools inspect "${DOCKER_IMAGE}:${tag}-${VERSION}"
            docker buildx imagetools inspect "${DOCKER_IMAGE}:${tag}"
          done
